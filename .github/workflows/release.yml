name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  create:
    name: Create release and source archive
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check tag matches project version
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          source_version="$(sed -n 's/^  VERSION \([0-9][0-9.]*\)$/\1/p' CMakeLists.txt | head -n 1)"
          if [ "$tag_version" != "$source_version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match CMake version $source_version" >&2
            exit 1
          fi
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            index($0, "## [" v "]") == 1 { found = 1; next }
            found && index($0, "## [") == 1 { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "No changelog section for $version" >&2
            exit 1
          fi
          # Re-running a failed workflow must not fail just because the release
          # was already created in an earlier attempt. Refresh its notes when
          # it exists; otherwise create it as normal.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file release-notes.md
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file release-notes.md
          fi
      - name: Attach source archive
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          git archive --format=tar.gz --prefix="formant-$version/" -o "formant-$version-source.tar.gz" HEAD
          gh release upload "$GITHUB_REF_NAME" "formant-$version-source.tar.gz" --clobber

  binaries:
    name: Build CLI for ${{ matrix.os }}
    needs: create
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build -j
      - name: Test
        run: ctest --test-dir build --output-on-failure --timeout 300
      - name: Package
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          system="$(uname -s | tr '[:upper:]' '[:lower:]')"
          arch="$(uname -m)"
          prefix="formant-$version-$system-$arch"
          mkdir -p "$prefix/bin" "$prefix/lib" "$prefix/include"
          cp build/formant "$prefix/bin/"
          install -m 755 scripts/formant-update.sh "$prefix/bin/formant-update"
          cp build/libformant_core.a "$prefix/lib/"
          cp -R include/formant "$prefix/include/"
          cp LICENSE README.md CHANGELOG.md "$prefix/"
          tar czf "$prefix.tar.gz" "$prefix"
      - name: Upload asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          system="$(uname -s | tr '[:upper:]' '[:lower:]')"
          arch="$(uname -m)"
          gh release upload "$GITHUB_REF_NAME" "formant-$version-$system-$arch.tar.gz" --clobber

  checksums:
    name: Publish checksums
    needs: [create, binaries]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Download release archives
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p artifacts
          gh release download "$GITHUB_REF_NAME" --dir artifacts --pattern 'formant-*.tar.gz'
      - name: Generate and verify checksums
        shell: bash
        run: |
          cd artifacts
          sha256sum formant-*.tar.gz > SHA256SUMS
          sha256sum --check SHA256SUMS
          while read -r sum file; do
            printf '%s  %s\n' "$sum" "$file" > "$file.sha256"
          done < SHA256SUMS
          cat SHA256SUMS
      - name: Upload checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          cd artifacts
          gh release upload "$GITHUB_REF_NAME" SHA256SUMS formant-*.tar.gz.sha256 --clobber
